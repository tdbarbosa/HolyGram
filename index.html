<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HolyGram Pro Clone</title>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#fafafa;
margin:0;
}

header{
background:white;
padding:15px;
text-align:center;
border-bottom:1px solid #ddd;
font-family:Georgia;
font-style:italic;
font-size:24px;
position:sticky;
top:0;
}

.container{
max-width:600px;
margin:auto;
padding:10px;
}

.create{
background:white;
padding:10px;
margin-bottom:20px;
border-radius:8px;
}

input,textarea{
width:100%;
padding:8px;
margin-top:5px;
border:1px solid #ddd;
border-radius:6px;
}

button{
margin-top:8px;
padding:8px;
border:none;
background:#0095f6;
color:white;
border-radius:6px;
cursor:pointer;
}

.post{
background:white;
margin-bottom:20px;
border-radius:8px;
overflow:hidden;
border:1px solid #ddd;
}

.post-header{
padding:10px;
font-weight:bold;
}

.carousel{
overflow:hidden;
position:relative;
}

.slides{
display:flex;
transition:.3s;
}

.slide{
min-width:100%;
}

.slide img{
width:100%;
height:400px;
object-fit:cover;
}

.footer{
padding:10px;
}

.like,.save{
cursor:pointer;
font-size:20px;
margin-right:10px;
}

.liked{color:red;}
.saved{color:orange;}

.comment{
font-size:14px;
margin-top:4px;
}

</style>

</head>

<body>

<header>HolyGram</header>

<div class="container">

<div class="create">

<input id="username" placeholder="Seu nome">

<input id="image" placeholder="URL da imagem">

<textarea id="caption" placeholder="Legenda"></textarea>

<button onclick="createPost()">Postar</button>

</div>

<div id="feed"></div>

</div>

<script>

/* DATABASE */

let posts=JSON.parse(localStorage.getItem("holygram"))||[];

/* SAVE */

function save(){
localStorage.setItem("holygram",JSON.stringify(posts));
}

/* CREATE */

function createPost(){

let username=document.getElementById("username").value;
let image=document.getElementById("image").value;
let caption=document.getElementById("caption").value;

if(!username||!image)return;

posts.unshift({
id:Date.now(),
username,
image,
caption,
likes:0,
liked:false,
saved:false,
comments:[]
});

save();
render();

}

/* LIKE */

function toggleLike(id){

let post=posts.find(p=>p.id==id);

post.liked=!post.liked;

post.likes+=post.liked?1:-1;

save();
render();

}

/* SAVE POST */

function toggleSave(id){

let post=posts.find(p=>p.id==id);

post.saved=!post.saved;

save();
render();

}

/* COMMENT */

function addComment(id,input){

if(!input.value)return;

let post=posts.find(p=>p.id==id);

post.comments.push(input.value);

input.value="";

save();
render();

}

/* RENDER */

function render(){

let feed=document.getElementById("feed");

feed.innerHTML="";

posts.forEach(post=>{

let el=document.createElement("div");

el.className="post";

el.innerHTML=`

<div class="post-header">

${post.username}

</div>

<div class="carousel">

<div class="slides">

<div class="slide">

<img src="${post.image}">

</div>

</div>

</div>

<div class="footer">

<span class="like ${post.liked?"liked":""}"
onclick="toggleLike(${post.id})">

${post.liked?"♥":"♡"}

</span>

<span class="save ${post.saved?"saved":""}"
onclick="toggleSave(${post.id})">

🔖

</span>

<div>

<b>${post.likes} curtidas</b>

</div>

<div>

${post.caption}

</div>

<div>

${post.comments.map(c=>`<div class="comment"><b>voce</b> ${c}</div>`).join("")}

</div>

<input placeholder="Comentar..."
onkeypress="if(event.key==='Enter')addComment(${post.id},this)">

</div>

`;

feed.appendChild(el);

});

}

render();

</script>

</body>
</html>
