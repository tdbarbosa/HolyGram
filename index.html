<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HolyGram - Mestre da Palavra</title>
    <style>
        :root { --ig-blue: #0095f6; --gold: #ffd700; --bg: #fafafa; --gray: #8e8e8e; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; }
        .app-container { max-width: 500px; margin: auto; background: white; min-height: 100vh; padding-bottom: 50px; }

        /* Estilo das Conquistas */
        .badges-section { display: flex; justify-content: space-around; padding: 20px; background: #f8f9fa; border-bottom: 1px solid #ddd; }
        .badge { text-align: center; opacity: 0.2; transition: 0.5s; filter: grayscale(100%); }
        .badge.unlocked { opacity: 1; filter: grayscale(0%); transform: scale(1.1); }
        .badge-icon { font-size: 30px; display: block; }
        .badge-name { font-size: 10px; font-weight: bold; margin-top: 5px; }

        /* Card Principal */
        .reading-card { margin: 20px; padding: 25px; border-radius: 20px; background: #262626; color: white; position: relative; overflow: hidden; }
        .reading-card::after { content: "📖"; position: absolute; right: -10px; bottom: -10px; font-size: 100px; opacity: 0.1; }

        .progress-container { padding: 0 20px; }
        .bar-bg { height: 12px; background: #eee; border-radius: 6px; margin: 10px 0; }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd700, #ff8c00); border-radius: 6px; transition: 0.8s; }

        .btn-check { width: calc(100% - 40px); margin: 20px; padding: 18px; border: none; border-radius: 12px; background: var(--ig-blue); color: white; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,149,246,0.3); }
        
        .status-text { text-align: center; color: var(--gray); font-size: 14px; }
    </style>
</head>
<body>

<div class="app-container">
    <header style="padding: 20px; border-bottom: 1px solid #eee; text-align: center;">
        <h2 style="font-family: cursive; margin: 0;">HolyGram</h2>
    </header>

    <div class="badges-section">
        <div class="badge" id="badge-1">
            <span class="badge-icon">🌱</span>
            <span class="badge-name">PRIMEIROS PASSOS</span>
        </div>
        <div class="badge" id="badge-2">
            <span class="badge-icon">🛡️</span>
            <span class="badge-name">FIEL NO POUCO</span>
        </div>
        <div class="badge" id="badge-3">
            <span class="badge-icon">🔥</span>
            <span class="badge-name">BEREANO</span>
        </div>
    </div>

    <div class="reading-card">
        <div style="font-size: 12px; text-transform: uppercase;">Leitura de Hoje</div>
        <div id="livro-do-dia" style="font-size: 32px; font-weight: bold; margin: 5px 0;">João 1</div>
        <p id="frase-dia" style="opacity: 0.8;">"No princípio era o Verbo..."</p>
    </div>

    <div class="progress-container">
        <div style="display: flex; justify-content: space-between; font-size: 14px;">
            <b>Seu esforço espiritual</b>
            <span id="txt-progresso">0%</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" id="fill"></div></div>
    </div>

    <button class="btn-check" onclick="progredir()">✅ Marcar Capítulo Lido</button>
    
    <p class="status-text" id="status-incentivo">Você ainda não leu nada hoje. Vamos começar?</p>
</div>

<script>
    let pontos = 0;

    function progredir() {
        if (pontos < 100) {
            pontos += 34; // 3 cliques para completar aproximadamente 100%
            if (pontos > 100) pontos = 100;

            document.getElementById('fill').style.width = pontos + "%";
            document.getElementById('txt-progresso').innerText = Math.round(pontos) + "%";

            // Lógica de desbloqueio de medalhas
            if (pontos >= 34) {
                document.getElementById('badge-1').classList.add('unlocked');
                document.getElementById('status-incentivo').innerText = "Boa! O importante é o primeiro passo.";
            }
            if (pontos >= 68) {
                document.getElementById('badge-2').classList.add('unlocked');
                document.getElementById('status-incentivo').innerText = "Muito bem! Você está sendo constante.";
            }
            if (pontos >= 100) {
                document.getElementById('badge-3').classList.add('unlocked');
                document.getElementById('status-incentivo').innerText = "Incrível! Meta do dia alcançada! 🌟";
                confetti(); // Se tivesse uma biblioteca de confete aqui
            }
        }
    }
</script>

</body>
</html>
